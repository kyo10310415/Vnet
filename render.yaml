# render.yaml
# ※ このファイルはBlueprint用です。
# 通常はRender DashboardからWeb ServiceとPostgreSQLを手動で作成してください。
# 手順はREADMEの「Renderデプロイ手順（Web Service）」を参照。

services:
  - type: web
    name: vtuber-ops
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vtuber-ops-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false   # デプロイ後に手動で設定
      - key: OPENAI_API_KEY
        sync: false   # 案件資料のAI解析に使用
      - key: NODE_ENV
        value: production

databases:
  - name: vtuber-ops-db
    databaseName: vtuber_ops
    plan: free
